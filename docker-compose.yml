version: "3.9"

x-env: &env
  DATABASE_URL: postgres://app:app@postgres:5432/grants
  API_TOKEN: dev-token
  WEBHOOK_SECRET: dev-webhook-secret
  DECISION_SERVICE_URL: http://mock-decision-service:4000
  DECISION_SERVICE_API_KEY: dev-key

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: grants
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d grants"]
      interval: 3s
      retries: 10

  mock-decision-service:
    build: ./mock-decision-service
    ports: ["4000:4000"]

  backend:
    build: ./backend
    environment: *env
    ports: ["3000:3000"]
    volumes: [uploads:/uploads]
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    build: ./worker
    environment: *env
    volumes: [uploads:/uploads]
    depends_on: { postgres: { condition: service_healthy } }

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
